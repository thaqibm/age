<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGE: Ascii game engine</title>
    <meta
      name="description"
      content="Small games and simulations. C++ / WebAssembly."
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main id="gallery-page">
      <header>
        <h1>AGE: Ascii game engine</h1>
        <nav aria-label="Links">
          <a href="https://thaqibm.github.io/">Home</a
          ><a href="https://github.com/thaqibm/age">Source</a>
        </nav>
      </header>
      <div
        id="gallery"
        class="gallery"
        aria-label="Live games and simulations"
      ></div>
      <p class="note" id="status" role="status">Loading…</p>
    </main>
    <section id="viewer" aria-labelledby="name" hidden>
      <div class="viewer-bar">
        <h2 id="name"></h2>
        <div class="controls">
          <a
            id="game-source"
            href="https://github.com/thaqibm/age/blob/main/web/game.cpp"
            target="_blank"
            rel="noopener"
            >source</a
          >
          <button id="regular" aria-pressed="true">Play</button>
          <button id="stress" aria-pressed="false">Stress</button>
          <button id="fps-toggle" aria-pressed="true">FPS</button>
          <button id="pause">Pause</button>
          <button id="restart">Restart</button>
          <button id="pulse">Pulse</button>
          <button
            id="close"
            aria-label="Close expanded view"
            title="Close (Esc)"
          >
            <!-- Font Awesome Free 7.3.1 by Fonticons, Inc. — CC BY 4.0; see assets/fontawesome-LICENSE.txt -->
            <svg
              class="fa-icon"
              viewBox="0 0 384 512"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="viewport">
        <div id="stage" class="stage">
          <div id="hud" class="hud"></div>
          <div id="metrics" class="metrics"></div>
          <div id="result" class="result" hidden>
            <p id="result-text"></p>
            <button id="again">Play again</button>
          </div>
        </div>
      </div>
      <p id="hint" class="note"></p>
    </section>
  </body>
</html>
