<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGE</title>
    <meta
      name="description"
      content="Small games and simulations. C++ / WebAssembly."
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>AGE</h1>
        <nav aria-label="Links">
          <a href="https://thaqibm.github.io/">Home</a
          ><a href="https://github.com/thaqibm/age">Source</a>
        </nav>
      </header>
      <div
        id="gallery"
        class="gallery"
        aria-label="Live games and simulations"
      ></div>
      <p class="note" id="status" role="status">Loading…</p>
    </main>
    <dialog id="viewer" aria-labelledby="name">
      <div class="viewer-bar">
        <h2 id="name"></h2>
        <div class="controls">
          <button id="regular" aria-pressed="true">Play</button>
          <button id="stress" aria-pressed="false">Stress</button>
          <button id="fps-toggle" aria-pressed="false">FPS</button>
          <button id="pause">Pause</button>
          <button id="restart">Restart</button>
          <button id="pulse">Pulse</button>
          <button id="close" aria-label="Close expanded view">Close ×</button>
        </div>
      </div>
      <div class="viewport">
        <div id="stage" class="stage">
          <div id="hud" class="hud"></div>
          <div id="metrics" class="metrics" hidden></div>
          <div id="result" class="result" hidden>
            <p id="result-text"></p>
            <button id="again">Play again</button>
          </div>
        </div>
      </div>
      <p id="hint" class="note"></p>
    </dialog>
  </body>
</html>
